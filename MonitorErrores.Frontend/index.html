<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitor de Errores</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Botón para abrir el chat -->
    <button id="chat-button" class="chat-button">
        💬
    </button>

    <!-- Ventana del chat -->
    <div id="chat-window" class="chat-window">

        <!-- Encabezado -->
        <div class="chat-header">
            <div>
                <strong>Monitor de Errores</strong>
                <span>Asistente de soporte</span>
            </div>

            <div class="chat-actions">
                <button id="minimize-chat" title="Minimizar">
                    −
                </button>

                <button id="close-chat" title="Cerrar">
                    ×
                </button>
            </div>
        </div>

        <!-- Mensajes -->
        <div id="chat-messages" class="chat-messages">

            <div class="bot-message-container">

                <div class="bot-avatar">M</div>

                <div class="message bot-message">Hola. ¿En qué puedo ayudarte?</div>

            </div>

        </div>
        <!-- Vista previa de imagen -->
        <div id="image-preview" class="image-preview">

            <div class="image-preview-header">
                <strong>Imagen seleccionada</strong>

                <button
                    id="remove-image"
                    type="button"
                    title="Quitar imagen">
                    ×
                </button>
            </div>

            <img
                id="preview-image"
                src=""
                alt="Vista previa">

            <div class="image-preview-footer">

                <span id="image-name"></span>

                <button
                    id="analyze-image"
                    type="button">
                    Analizar imagen
                </button>

            </div>

        </div>

        
        <!-- Confirmación de los datos detectados -->
        <div id="error-review" class="error-review">

            <div class="error-review-header">
                <strong>Revisá los datos detectados</strong>
                <span>Corregilos si es necesario antes de continuar.</span>
            </div>

            <label for="review-code">Código del error</label>
            <input
                type="text"
                id="review-code"
                placeholder="Ej.: 404, TIMEOUT"
            >

            <label for="review-service">Servicio involucrado</label>
            <select id="review-service">
                <option value="General">General / No identificado</option>
                <option value="Banco">Banco</option>
                <option value="Pago">Pago</option>
                <option value="Tarjeta">Tarjeta</option>
                <option value="Autenticacion">Autenticación</option>
            </select>
            
            <label for="review-situation">¿Qué sucede cuando intentás realizar la operación?</label>

            <select id="review-situation">
                <option value="">No estoy seguro</option>
                <option value="rechazado">La operación es rechazada</option>
                <option value="pendiente">La operación queda pendiente</option>
                <option value="error">Aparece un mensaje de error</option>
                <option value="sin_respuesta">La pantalla no responde</option>
                <option value="otro">Sucede otra cosa</option>
            </select>

            <label for="review-message">Mensaje original</label>
            <textarea
                id="review-message"
                rows="4"
                placeholder="Mensaje de error recibido"
            ></textarea>

            <div class="error-review-actions">
                <button id="cancel-review" type="button">
                    Cancelar
                </button>

                <button id="confirm-review" type="button">
                    Confirmar y analizar
                </button>
            </div>

        </div>

        <!-- Área para escribir -->
        <div class="chat-input-area">

            <button id="attach-button" class="attach-button" title="Adjuntar imagen">
                📎
            </button>

            <input
                type="file"
                id="image-input"
                accept="image/*"
                hidden
            >

            <textarea
                id="message-input"
                placeholder="Escribí tu problema..."
                rows="1"
            ></textarea>

            <button id="send-button" class="send-button">
                ➤
            </button>

        </div>

    </div>
    <!-- Visor de imagen ampliada -->
    <div id="image-modal" class="image-modal">

        <button
            id="close-image-modal"
            class="close-image-modal"
            type="button"
            title="Cerrar">
            ×
        </button>

        <img
            id="modal-image"
            class="modal-image"
            src=""
            alt="Imagen ampliada">

    </div>
    <script src="js/app.js"></script>

</body>
</html>
